# Noctyx alert rules — evaluated by the head node's Prometheus.
# Sources: the UI's /metrics (job @PROM_JOB_CONSOLE@) + node_exporter (job @PROM_JOB_NODES@ / node).
# Installed by install-alerting.sh; check with: promtool check rules rules.yml
groups:
- name: noctyx
  rules:
  - alert: BackupNever
    expr: @METRIC_PREFIX@_backup_health_code == 3
    for: 2h
    labels: {severity: critical}
    annotations: {summary: "{{ $labels.host }}/{{ $labels.profile }} has NO backup on the NAS"}
  - alert: BackupStale
    expr: @METRIC_PREFIX@_backup_health_code == 2
    for: 1h
    labels: {severity: critical}
    annotations: {summary: "{{ $labels.host }}/{{ $labels.profile }} backup is >2 intervals old"}
  - alert: BackupLate
    expr: @METRIC_PREFIX@_backup_health_code == 1
    for: 6h
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}/{{ $labels.profile }} missed its last backup window"}
  - alert: BackupJobFailed
    expr: @METRIC_PREFIX@_run_last_rc{cmd=~"backup|tick"} != 0 and @METRIC_PREFIX@_run_running == 0
    for: 15m
    labels: {severity: warning}
    annotations: {summary: "last {{ $labels.cmd }} run{{ if $labels.host }} for {{ $labels.host }}{{ end }} exited {{ $value }} — see Runs"}
  - alert: JobDied
    expr: @METRIC_PREFIX@_run_died == 1
    for: 5m
    labels: {severity: warning}
    annotations: {summary: "a {{ $labels.cmd }} job{{ if $labels.host }} on {{ $labels.host }}{{ end }} ended without an exit record (killed?)"}
  - alert: RepoUnreadable
    expr: @METRIC_PREFIX@_repo_unreadable == 1
    for: 30m
    labels: {severity: critical}
    annotations: {summary: "repository {{ $labels.repo }} on the NAS cannot be listed"}
  - alert: RestEndpointDown
    expr: @METRIC_PREFIX@_rest_endpoint_up == 0
    for: 15m
    labels: {severity: critical}
    annotations: {summary: "repository endpoint {{ $labels.url }} not answering (clients cannot back up)"}
  - alert: TickTimerInactive
    expr: @METRIC_PREFIX@_tick_timer_active == 0
    for: 30m
    labels: {severity: critical}
    annotations: {summary: "@UNIT_PREFIX@-tick.timer is not active — nothing is scheduling backups"}
  - alert: NasNotMounted
    expr: @METRIC_PREFIX@_tier_mounted{tier=~"nas.*"} == 0
    for: 10m
    labels: {severity: critical}
    annotations: {summary: "the NAS is not mounted on the head node"}
  - alert: NasLowSpace
    expr: @METRIC_PREFIX@_tier_free_bytes{tier=~"nas.*"} / (@METRIC_PREFIX@_tier_free_bytes{tier=~"nas.*"} + @METRIC_PREFIX@_tier_used_bytes{tier=~"nas.*"}) < 0.10
    for: 30m
    labels: {severity: warning}
    annotations: {summary: "the NAS below 10% free ({{ $value | humanizePercentage }})"}
  - alert: NasRaidDegraded
    expr: @METRIC_PREFIX@_nas_raid_members_active < @METRIC_PREFIX@_nas_raid_members_total
    for: 5m
    labels: {severity: critical}
    annotations: {summary: "NAS {{ $labels.array }} ({{ $labels.level }}) has {{ $value }} of its members — a disk is out"}
  - alert: NasRaidUnknown
    expr: @METRIC_PREFIX@_source_ok{source="nas_raid"} == 0
    for: 30m
    labels: {severity: warning}
    annotations: {summary: "cannot read RAID state from the NAS (ssh)"}
  - alert: ComponentBehind
    expr: @METRIC_PREFIX@_component_behind == 1
    for: 1h
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: {{ $labels.component }} {{ $labels.installed }} is behind Noctyx's pin {{ $labels.pinned }} — {{ $labels.upgrade }}"}
  - alert: ComponentUpgradeAvailable
    expr: @METRIC_PREFIX@_component_upgrade_available == 1
    for: 1h
    labels: {severity: info}
    annotations: {summary: "{{ $labels.host }}: {{ $labels.component }} {{ $labels.latest }} is out (running {{ $labels.installed }}) — {{ $labels.upgrade }}"}
  - alert: NoctyxNeedsAttention
    # disk, units, backups, slots, upgrades and a freeze have their own alerts (HostRootFilesystemFull, …,
    # NoctyxHealFrozen), which show what self-repair did about them
    expr: @METRIC_PREFIX@_heal_problem{check!~"disk|units|backups|slots|upgrades|heal"} == 1
    for: 15m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: {{ $labels.what }} — noctyx heal cannot repair this on its own"}
  - alert: NoctyxRepairedItself
    expr: @METRIC_PREFIX@_heal_repairs_24h > 0
    labels: {severity: info}
    annotations: {summary: "{{ $labels.host }}: Noctyx repaired its {{ $labels.check }} {{ $value }} time(s) in the last 24 h (Jobs / Audit says what)"}
  - alert: NoctyxHealFrozen
    expr: @METRIC_PREFIX@_heal_frozen == 1
    labels: {severity: warning}
    annotations: {summary: "self-repair is frozen: several repairs in a row failed, and none runs until someone unfreezes it (Self-repair page, or noctyx heal --unfreeze)"}
  - alert: NoctyxHealNotRunning
    expr: time() - @METRIC_PREFIX@_heal_last_run_timestamp_seconds > 1800
    for: 10m
    labels: {severity: warning}
    annotations: {summary: "noctyx heal has not run for 30 minutes: nothing repairs what breaks (systemctl status @UNIT_PREFIX@-heal.timer)"}
  - alert: VersionsUnknown
    expr: time() - @METRIC_PREFIX@_versions_timestamp_seconds > 3 * 86400
    for: 1h
    labels: {severity: warning}
    annotations: {summary: "component versions not checked for 3 days (the nightly run does it: noctyx versions)"}
  - alert: NoctyxMetricsDown
    expr: up{job="@PROM_JOB_CONSOLE@"} == 0
    for: 10m
    labels: {severity: critical}
    annotations: {summary: "the Noctyx UI/metrics endpoint is down"}
  - alert: NodeExporterDown
    expr: up{job=~"@PROM_JOB_NODES@|node"} == 0
    for: 15m
    labels: {severity: warning}
    annotations: {summary: "no metrics from {{ $labels.host }} (host down or exporter stopped)"}
  - alert: HostRootFilesystemFull
    expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 92
    for: 30m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }} root filesystem {{ $value | printf \"%.0f\" }}% full"}
  - alert: HostHygieneWarning
    expr: @METRIC_PREFIX@_hygiene_items{severity="warning"} > 0
    for: 24h
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }} has {{ $value }} housekeeping warning(s) for a day — Hygiene panel"}
  - alert: HostSystemdUnitFailed
    expr: count by(host)(node_systemd_unit_state{state="failed"} == 1) > 0
    for: 24h
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }} has {{ $value }} failed systemd unit(s) for a day"}
# tensorfold (noctyx llm-discover) exposes the same counters as vLLM under its own
# names, with a `model` label instead of `model_name`. The UI and the LLM alerts are written
# for vLLM's names, so record them here under those names. Both are counters, so the UI's
# rate()/increase() work unchanged. No KV-cache or latency histograms exist: those stay "—".
- name: tensorfold-as-vllm
  rules:
  - record: vllm:num_requests_running
    expr: label_replace(tensorfold_requests_inflight, "model_name", "$1", "model", "(.*)")
      or tensorfold:num_requests_running
  - record: vllm:generation_tokens_total
    expr: label_replace(tensorfold_completion_tokens_total, "model_name", "$1", "model", "(.*)")
      or tensorfold:generation_tokens_total
  - record: vllm:prompt_tokens_total
    expr: label_replace(tensorfold_prompt_tokens_total, "model_name", "$1", "model", "(.*)")
      or tensorfold:prompt_tokens_total
  - record: vllm:request_success_total
    expr: label_replace(tensorfold_requests_total - tensorfold_request_errors_total, "model_name", "$1", "model", "(.*)")
      or tensorfold:e2e_request_latency_seconds_count
  - record: vllm:request_decode_time_seconds_sum
    expr: label_replace(tensorfold_decode_seconds_total, "model_name", "$1", "model", "(.*)")
      or tensorfold:request_decode_time_seconds_sum
  - record: vllm:request_prefill_time_seconds_sum
    expr: label_replace(tensorfold_prefill_seconds_total, "model_name", "$1", "model", "(.*)")
      or tensorfold:request_prefill_time_seconds_sum
  # prompt tokens resumed from cache vs. all prompt tokens = the prefix-cache hit share
  - record: vllm:prefix_cache_hits_total
    expr: label_replace(tensorfold_cached_tokens_total, "model_name", "$1", "model", "(.*)")
  - record: vllm:prefix_cache_queries_total
    expr: label_replace(tensorfold_prompt_tokens_total, "model_name", "$1", "model", "(.*)")
  # the roster's "started" column reads process_start_time_seconds{job="llm"}
  - record: process_start_time_seconds
    expr: time() - tensorfold_uptime_seconds
# tensorfold-native (/opt/tensorfold/native) already uses vLLM's names under a `tensorfold:`
# prefix, with no model label at all: llm-discover puts `model_name` on its scrape target.
# Names both builds produce are recorded once above (`old or native`); promtool rejects duplicates.
# It does have KV-cache and latency histograms. Per-request time-per-output-token stands in
# for vLLM's inter-token latency; completed requests = the e2e latency histogram's count.
- name: tensorfold-native-as-vllm
  rules:
  - record: vllm:num_requests_waiting
    expr: tensorfold:num_requests_waiting
  - record: vllm:num_preemptions_total
    expr: tensorfold:preemptions_total
  - record: vllm:kv_cache_usage_perc
    expr: max without(stream) (tensorfold:kv_cache_usage_perc)
  - record: vllm:time_to_first_token_seconds_bucket
    expr: tensorfold:time_to_first_token_seconds_bucket
  - record: vllm:e2e_request_latency_seconds_bucket
    expr: tensorfold:e2e_request_latency_seconds_bucket
  - record: vllm:inter_token_latency_seconds_bucket
    expr: tensorfold:request_time_per_output_token_seconds_bucket
  - record: vllm:request_decode_time_seconds_bucket
    expr: tensorfold:request_decode_time_seconds_bucket
  - record: vllm:request_prefill_time_seconds_bucket
    expr: tensorfold:request_prefill_time_seconds_bucket
- name: llm
  rules:
  - alert: TensorfoldEngineFatal
    expr: tensorfold_engine_fatal == 1
    for: 2m
    labels: {severity: critical}
    annotations: {summary: "{{ $labels.host }} {{ $labels.model }}: tensorfold engine raised — restart both ranks (it refuses requests until then)"}
  - alert: LLMServerDown
    expr: up{job="llm"} == 0
    for: 10m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.engine }} on {{ $labels.host }}:{{ $labels.port }} stopped answering /metrics"}
  - alert: LLMQueueBacklog
    expr: max by(host, model_name)(vllm:num_requests_waiting) > 20
    for: 10m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }} {{ $labels.model_name }}: {{ $value }} requests waiting for 10 min"}
  - alert: LLMKvCacheFull
    expr: max by(host, model_name)(vllm:kv_cache_usage_perc) > 0.97
    for: 15m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }} {{ $labels.model_name }}: KV cache at {{ $value | humanizePercentage }} — requests will be preempted"}
  - alert: MtplxUpstreamDown
    expr: up_mtplx == 0
    for: 5m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: MTPLX server unreachable from the exporter — LLM stats frozen (address change, server down, or key)"}
# Early warnings across the fleet: NAS and NFS performance, the GPU pairs' RoCE fabric, sshd logins, storage
# growth. Thresholds: the site config's "signals" block (noctyx signals-set; src/noctyx/signals.py).
- name: signals
  rules:
  - alert: NfsMountHung
    expr: @METRIC_PREFIX@_nfs_probe_running_seconds > 180
    labels: {severity: critical}
    annotations: {summary: "{{ $labels.host }}: an NFS mount has not answered the probe for {{ $value | humanizeDuration }} (a hung mount: anything that touches it waits)"}
  - alert: NfsProbeFailing
    expr: @METRIC_PREFIX@_nfs_probe_ok == 0
    for: 10m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: the probe cannot write, read or remove its file on {{ $labels.mountpoint }} ({{ $labels.source }})"}
  - alert: NfsSlow
    expr: |
      (
        @METRIC_PREFIX@_nfs_probe_write_bytes_per_second < @SIG_NFS_SLOW_RATIO@ * quantile_over_time(0.5, @METRIC_PREFIX@_nfs_probe_write_bytes_per_second[7d])
        or @METRIC_PREFIX@_nfs_probe_read_bytes_per_second < @SIG_NFS_SLOW_RATIO@ * quantile_over_time(0.5, @METRIC_PREFIX@_nfs_probe_read_bytes_per_second[7d])
        or @METRIC_PREFIX@_nfs_probe_small_op_seconds > @SIG_NFS_OP_SECONDS@
      ) unless on() (max(@METRIC_PREFIX@_spindle_busy) > 0)
    for: 30m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: {{ $labels.mountpoint }} is slow for 30 min: a probe reading of {{ $value | humanize }} (bytes/s, or seconds per small file) against its usual, with no backup running"}
  - alert: NfsRetransmitting
    expr: rate(node_nfs_rpc_retransmissions_total[15m]) > 0.05 and rate(node_nfs_rpc_retransmissions_total[15m]) / clamp_min(rate(node_nfs_rpcs_total[15m]), 1) > 0.01
    for: 15m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: over 1% of NFS calls are retransmitted ({{ $value | humanizePercentage }}): the NAS or the network to it is struggling"}
  - alert: RestEndpointSlow
    expr: @METRIC_PREFIX@_rest_endpoint_seconds > @SIG_ENDPOINT_SECONDS@
    for: 15m
    labels: {severity: warning}
    annotations: {summary: "the NAS backup endpoint takes {{ $value | humanizeDuration }} to answer (over @SIG_ENDPOINT_SECONDS@ s for 15 min)"}
  - alert: FabricLinkDown
    # a port that is up most of the time (over half of the last week), not one plugged in for an afternoon
    expr: node_infiniband_state_id != 4 and on(instance, device, port) avg_over_time((node_infiniband_state_id == bool 4)[7d:15m]) > 0.5
    for: 2m
    labels: {severity: critical}
    annotations: {summary: "{{ $labels.host }}: RoCE port {{ $labels.device }} is down; it was up most of the week (the GPU pair's link)"}
  - alert: FabricLinkSlow
    expr: (node_infiniband_rate_bytes_per_second < on(instance, device, port) max_over_time(node_infiniband_rate_bytes_per_second[7d])) and on(instance, device, port) node_infiniband_state_id == 4
    for: 5m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: RoCE port {{ $labels.device }} runs at {{ $value | humanize }}B/s, below the rate it had this week (a renegotiated link: cable or port)"}
  - alert: FabricLinkErrors
    expr: |
      sum by (host, instance, device) (
        increase(node_infiniband_link_downed_total[1h]) + increase(node_infiniband_link_error_recovery_total[1h])
        + increase(node_infiniband_symbol_error_total[1h]) + increase(node_infiniband_port_errors_received_total[1h])
        + increase(node_infiniband_local_link_integrity_errors_total[1h])
      ) > 0
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: RoCE port {{ $labels.device }} logged {{ $value | humanize }} link errors in the last hour (link drops, recoveries, symbol or receive errors)"}
  - alert: FabricRetransmits
    expr: |
      sum by (host, instance, device) (
        rate(node_infiniband_roce_adp_retransmits_total[10m]) + rate(node_infiniband_local_ack_timeout_errors_total[10m])
        + rate(node_infiniband_out_of_sequence_packets_received_total[10m]) + rate(node_infiniband_packet_sequence_errors_total[10m])
      ) > @SIG_FABRIC_RETRANSMITS_PER_SECOND@
    for: 10m
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: RoCE port {{ $labels.device }} retransmits or reorders {{ $value | humanize }}/s (over @SIG_FABRIC_RETRANSMITS_PER_SECOND@/s for 10 min): congestion or a bad link slows the pair"}
  - alert: SshFailedLoginsBurst
    expr: increase(@METRIC_PREFIX@_ssh_failed_logins_total[15m]) + increase(@METRIC_PREFIX@_ssh_invalid_user_attempts_total[15m]) > @SIG_SSH_FAILED_PER_15M@
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: {{ $value | humanize }} failed or invalid-user ssh logins in 15 min (over @SIG_SSH_FAILED_PER_15M@)"}
  - alert: SshLoginFromNewAddress
    expr: time() - @METRIC_PREFIX@_ssh_new_source_login_timestamp_seconds < 3600
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: {{ $labels.user }} logged in over ssh from {{ $labels.addr }}, an address no login came from before"}
  - alert: StorageFullSoon
    expr: |
      predict_linear(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs|nfs|nfs4|apfs",mountpoint!~"/boot.*|/snap/.*|/System/Volumes/.*|/Volumes/Recovery|/private/var/.*"}[7d], @SIG_FULL_WITHIN_DAYS@ * 86400) < 0
      and node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs|nfs|nfs4|apfs",mountpoint!~"/boot.*|/snap/.*|/System/Volumes/.*|/Volumes/Recovery|/private/var/.*"} / node_filesystem_size_bytes < 0.5
    # the week's trend, held for 6 h: a download or benchmark run that is cleaned up again does not set it off
    for: 6h
    labels: {severity: warning}
    annotations: {summary: "{{ $labels.host }}: {{ $labels.mountpoint }} fills within @SIG_FULL_WITHIN_DAYS@ days at its rate of the last week"}
  - alert: StorageGrewFast
    expr: (node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs|nfs|nfs4|apfs",mountpoint!~"/boot.*|/snap/.*|/System/Volumes/.*|/Volumes/Recovery|/private/var/.*"} offset 1h - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs|nfs|nfs4|apfs",mountpoint!~"/boot.*|/snap/.*|/System/Volumes/.*|/Volumes/Recovery|/private/var/.*"}) > @SIG_GROWTH_GB_PER_HOUR@ * 1e9
    labels: {severity: info}
    annotations: {summary: "{{ $labels.host }}: {{ $labels.mountpoint }} grew by {{ $value | humanize1024 }}B in the last hour (over @SIG_GROWTH_GB_PER_HOUR@ GB)"}
