# Noctyx (noctyx install-agent, install-head): needrestart never restarts Noctyx's units. Backups, copies,
# verifies, recipe switches and the tick run as @UNIT_PREFIX@-* units and must only end on their own: an apt
# run whose needrestart restarted one killed a 1.9 TB restic copy 86 minutes in.
$nrconf{override_rc}->{qr(^@UNIT_PREFIX@-)} = 0;
