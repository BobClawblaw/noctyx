# Noctyx macOS exclusions: added to the common list on every Mac.
#
# A Mac comes back by reinstalling macOS (or Recovery) and restoring the data on top, so the sealed
# system volume and everything macOS rebuilds by itself stays out. Each entry says why it is safe.

# ── The sealed, signed system volume: read-only, restored by reinstalling macOS. Its Data
#    volume is reached through the firmlinks (/Users, /Applications, /Library, /private …),
#    so walking /System/Volumes/Data as well would store every file twice. ──
/System
/System/**

# ── Other volumes: network shares, external disks, Time Machine. Backup sources (or other
#    backups) in their own right, never part of this Mac's root. ──
/Volumes
/Volumes/**
/.vol
/.Trashes
/.TemporaryItems
/.Spotlight-V100
/.fseventsd
/.DocumentRevisions-V100
/.MobileBackups
/.MobileBackups.trash
/.PKInstallSandboxManager-SystemSoftware
/cores

# ── Swap, sleep image, per-boot temp and caches: rebuilt by macOS ──
/private/var/vm/**
/private/var/folders/**
/private/var/tmp/**
/private/tmp/**
/private/var/run/**
/private/var/db/uuidtext/**
/private/var/db/diagnostics/**
/private/var/db/Spotlight-V100/**
/Library/Caches/**
/Library/Updates/**
/Users/*/Library/Caches/**
/Users/*/Library/Containers/*/Data/Library/Caches/**
/Users/*/Library/Logs/DiagnosticReports/**
/Users/*/.Trash/**

# ── Hugging Face model caches: the head's HF mirror keeps every model once, so a Mac's copy is
#    re-fetched from the cluster, not the Hub. (Linux nodes keep theirs: see exclusions-common.) ──
/Users/*/.cache/huggingface/**
/var/root/.cache/huggingface/**

# ── Deliberately NOT excluded ──────────────────────────────────────────────
#  /Users            home directories: the point of the backup
#  /etc, /private/etc  system configuration (/etc is /private/etc)
#  /Library/LaunchDaemons, /Library/LaunchAgents  this machine's services
#  /Applications     restorable from installers, but losing them costs an afternoon
#  /opt/homebrew, /usr/local  what brew installed, and its configuration
