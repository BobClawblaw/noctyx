[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "noctyx"
version = "0.9.6"
description = "The night-shift operator for your AI cluster: deploy model recipes, cache Hugging Face models, back up every Linux node, and watch the fleet with an LLM that explains what it sees. Head runs on Linux or macOS. Free noncommercial software (PolyForm Noncommercial 1.0.0) — donationware via Bitcoin. Alpha."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
noctyx = "noctyx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noctyx = ["agent/*", "metrics/*", "units/*", "assets/*", "assets/fonts/*", "restore/*", "restore/cidata/*", "demo/*", "server/*"]
